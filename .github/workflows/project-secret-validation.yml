name: isolated-project-secret-validation

on:
  push:
    branches: ['acceptance/project-secret-validation']
    paths:
      - '.github/workflows/project-secret-validation.yml'
      - 'scripts/project-secret-validation.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: isolated-project-secret-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'JusticeSc/harness-governance-public-acceptance-20261023-c7a4'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise only one isolated personal Project
        env:
          PROJECT_TOKEN: ${{ secrets.GOVERNANCE_TEST_PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/project-secret-validation.mjs
