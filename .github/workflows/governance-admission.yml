name: governance-admission

on:
  push:
    branches: ['acceptance/**']
  pull_request:
    branches: ['acceptance/resumed-protected']

permissions:
  contents: read

concurrency:
  group: governance-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    name: governance admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate registered work records
        run: node bin/governance.mjs status .
