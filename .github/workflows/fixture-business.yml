name: fixture-business
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  business:
    name: fixture business
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise actual project-name CLI
        shell: bash
        run: |
          node --version
          test "$(node src/project-name.js '  Governance Acceptance  ')" = 'Governance Acceptance'
          set +e
          output="$(node src/project-name.js '' 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = 'Project name is required'
