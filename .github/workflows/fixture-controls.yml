name: authorized-approval-fixture-controls
run-name: authorized-approval-fixture:${{ inputs.phase }}
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Finite authorized isolated acceptance operation
        required: true
        type: choice
        options:
          - open-business
          - bump-business
          - open-policy
          - forge-policy-status
          - open-delegation
          - repair-policy
permissions:
  contents: write
  pull-requests: write
  statuses: write
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run bounded fixture operation
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.phase }}
        run: node .github/fixture-control.mjs
